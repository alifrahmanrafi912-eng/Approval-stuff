<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Marketing Operations — Global Consumer Ltd.</title>
<style>
:root{
  --navy:#0b2a4a; --navy2:#0e3158; --navy3:#15406e; --accent:#0f6cbd; --accent-d:#0b5699;
  --bg:#f3f5f8; --card:#ffffff; --border:#d9dee5; --border2:#e8ecf1; --text:#1f2933; --muted:#5b6776;
  --green:#1e7e4a; --green-d:#176a3d; --red:#b3261e; --red-d:#971f19; --amber:#8a5300;
  --shadow:0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
svg{flex:none}

.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 1fr;height:100vh}

/* Top bar */
.topbar{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px 0 0;border-bottom:1px solid #071c33;position:relative;z-index:20}
.brand{width:232px;display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;flex:none}
.logo{width:30px;height:30px;border-radius:6px;background:#fff;color:var(--navy);font-weight:800;font-size:13px;display:grid;place-items:center;letter-spacing:.5px}
.brand b{display:block;font-size:14px;font-weight:600;line-height:1.1}
.brand small{display:block;font-size:11px;color:#9db6d1;margin-top:2px}
.search{position:relative;flex:1;max-width:560px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9db6d1}
.search input{width:100%;height:34px;border-radius:4px;border:1px solid #2a4f78;background:#123a63;color:#fff;padding:0 12px 0 36px;font:inherit;outline:none}
.search input::placeholder{color:#9db6d1}
.search input:focus{background:#fff;color:var(--text);border-color:#fff}
.search input:focus::placeholder{color:#8794a3}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-date{font-size:12.5px;color:#cfe0f2;padding:0 12px;border-right:1px solid #2a4f78;margin-right:6px;white-space:nowrap}
.tb-btn{background:transparent;border:0;color:#fff;width:36px;height:36px;border-radius:4px;display:grid;place-items:center;position:relative}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.dot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#d13438;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.profile{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:4px;background:transparent;border:0;color:#fff;text-align:left}
.profile:hover{background:rgba(255,255,255,.12)}
.avatar{width:32px;height:32px;border-radius:50%;background:#5aa9e6;color:#06223f;font-weight:700;font-size:12px;display:grid;place-items:center}
.profile b{display:block;font-size:12.5px;font-weight:600;line-height:1.15}
.profile small{display:block;font-size:11px;color:#9db6d1}
.bellwrap{position:relative}
.bellmenu{display:none;position:absolute;right:0;top:42px;width:360px;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(16,24,40,.18)}
.bellmenu.open{display:block}
.bellmenu .bh{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between}
.bellitem{padding:10px 14px;border-bottom:1px solid var(--border2);cursor:pointer;display:flex;gap:10px}
.bellitem:hover{background:#f6f8fb}
.bellitem .t{font-size:11.5px;color:var(--muted)}
.bellmenu .bf{padding:9px 14px;text-align:center}
.udot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.udot.read{background:transparent;border:1px solid #c3ccd6}

/* Sidebar */
.sidebar{background:var(--navy2);color:#d6e3f1;display:flex;flex-direction:column;padding:12px 0;overflow:auto}
.navgroup{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#7f9bb9;padding:10px 20px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 20px;background:none;border:0;color:inherit;text-align:left;border-left:3px solid transparent;font-size:14px}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.active{background:rgba(255,255,255,.13);color:#fff;border-left-color:#5aa9e6;font-weight:600}
.nav .badgec{margin-left:auto;background:#d13438;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
.nav .badgec.blue{background:#2f6fb0}
.sidefoot{margin-top:auto;padding:14px 20px;font-size:11.5px;color:#7f9bb9;border-top:1px solid rgba(255,255,255,.1)}

/* Main */
.main{overflow:auto;padding:20px 28px 48px}
.wrap{max-width:1760px;margin:0 auto}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:8px;margin-bottom:6px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:600;color:#10243b}
.sub{color:var(--muted);margin-top:2px;font-size:13px}
.headmeta{display:flex;align-items:center;gap:14px}
.muted{color:var(--muted)} .sm{font-size:12.5px}
.mt{margin-top:16px}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 18px;color:var(--muted);font-size:14px;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--text);background:rgba(15,108,189,.05)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{background:#e4e9f0;color:#41505f;border-radius:9px;font-size:11px;padding:0 7px;font-weight:600}
.tab .cnt.red{background:#fbe3e0;color:var(--red)}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow)}
.cardhead{padding:12px 16px;border-bottom:1px solid var(--border2);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cardbody{padding:16px}
.cardfoot{padding:10px 16px;border-top:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fafbfc;border-radius:0 0 6px 6px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* Preview */
.stage{height:clamp(320px,calc(100vh - 345px),700px);background:#e7ebf1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px;transition:background .15s}
.stage.drag{background:#d5e6f7;outline:2px dashed var(--accent);outline-offset:-8px}
.stage img{max-width:100%;max-height:100%;box-shadow:0 2px 10px rgba(16,24,40,.22);background:#fff;display:block}
.stage.zoomed{display:block}
.stage.zoomed img{max-width:none;max-height:none;height:auto;margin:0 auto}
.zoom{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.ib{background:#fff;border:1px solid var(--border);border-radius:4px;height:26px;min-width:26px;padding:0 6px;color:var(--text)}
.ib:hover{background:#f1f4f8}
.metaline{font-size:12.5px;color:var(--muted)}
.foot-actions{display:flex;gap:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;border:1px solid transparent;padding:8px 16px;font-weight:600;transition:background .12s}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.lg{height:48px;font-size:15px;flex:1}
.btn.approve{background:var(--green);color:#fff}.btn.approve:hover{background:var(--green-d)}
.btn.reject{background:var(--red);color:#fff}.btn.reject:hover{background:var(--red-d)}
.btn.secondary{background:#fff;border-color:#b8c2cf;color:#1f2933}.btn.secondary:hover{background:#f1f4f8}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-d)}
.btn:focus-visible,.tab:focus-visible,.nav:focus-visible{outline:2px solid #5aa9e6;outline-offset:2px}
.btnrow{display:flex;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:12px 0 0}
.notice{background:#f1f5fa;border:1px solid #d4deea;border-radius:4px;padding:10px 12px;color:#35465a;font-size:13px}

/* Approval card */
.statusrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.statusrow .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.due{font-size:12.5px;color:var(--muted)}
.due b{color:var(--red)}
.decision{border-radius:6px;padding:14px 16px;border:1px solid;animation:fadein .3s ease}
.decision.ok{background:#eaf6ef;border-color:#b7dcc6}
.decision.bad{background:#fcecea;border-color:#efc0bb}
.dlabel{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.dstatus{font-size:34px;font-weight:700;letter-spacing:1.5px;line-height:1.2}
.decision.ok .dstatus{color:var(--green)}
.decision.bad .dstatus{color:var(--red)}
.dmeta{font-size:13px;color:#33414f;margin-top:4px}
.dmeta div{margin-top:3px}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Badges */
.badge{display:inline-block;border-radius:3px;padding:2px 9px;font-size:11.5px;font-weight:700;letter-spacing:.6px;border:1px solid;white-space:nowrap}
.badge.ok{background:#e6f4ec;color:var(--green-d);border-color:#b7dcc6}
.badge.bad{background:#fbe9e7;color:#a3211a;border-color:#efc0bb}
.badge.warn{background:#fff4e0;color:var(--amber);border-color:#f0d7a5}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.prio::before{content:"";width:8px;height:8px;border-radius:50%;background:#8a96a3}
.prio.high::before{background:var(--red)} .prio.medium::before{background:#d08a00}

/* DL */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:0}
.dl div{padding:9px 16px;border-bottom:1px solid var(--border2)}
.dl div:nth-last-child(-n+2){border-bottom:0}
.dl dt,.dl .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dl .v{font-weight:500;margin-top:1px;word-break:break-word}
.dl .full{grid-column:1/3}

/* Tables */
.tblwrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:10px 14px;background:#f7f9fb;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border2);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f4f8fd}
.tbl tr:last-child td{border-bottom:0}
.tbl .id{font-weight:600;color:var(--accent);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:28px!important}
body.compact .tbl td{padding:6px 14px}
.pass{color:var(--green-d);font-weight:600}.fail{color:var(--red);font-weight:700}

.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
select,textarea,input[type=text]{font:inherit;border:1px solid #b8c2cf;border-radius:4px;padding:7px 10px;background:#fff;color:var(--text)}
select:focus,textarea:focus{outline:2px solid #9cc5ec;border-color:var(--accent)}
.chip{display:inline-flex;gap:6px;align-items:center;background:#e8f1fb;color:#0b4f8a;border-radius:12px;padding:2px 4px 2px 10px;font-size:12.5px}
.chip button{background:none;border:0;color:inherit;font-size:15px;line-height:1;padding:0 6px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:16px 18px;border-left:4px solid var(--accent)}
.kpi .n{font-size:30px;font-weight:600;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:2px}
.kpi.g{border-left-color:var(--green)}.kpi.r{border-left-color:var(--red)}.kpi.a{border-left-color:#d08a00}
.alertbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff7e8;border:1px solid #f0d7a5;border-radius:6px;padding:12px 16px;margin-bottom:16px}
.alertbar.info{background:#eef4fb;border-color:#cfdeef}

/* Feed / timeline */
.feed{list-style:none;margin:0;padding:6px 16px 10px}
.feed li{padding:10px 0;border-bottom:1px solid var(--border2);display:flex;gap:12px}
.feed li:last-child{border-bottom:0}
.feed .ft{font-size:12px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:8px 20px 14px;position:relative}
.tl li{position:relative;padding:12px 0 12px 28px;border-bottom:1px solid var(--border2)}
.tl li:last-child{border-bottom:0}
.tl li::before{content:"";position:absolute;left:3px;top:18px;width:10px;height:10px;border-radius:50%;background:#8aa3bd}
.tl li::after{content:"";position:absolute;left:7px;top:30px;bottom:-12px;width:2px;background:#d9e1ea}
.tl li:last-child::after{display:none}
.tl li.ok::before{background:var(--green)}.tl li.bad::before{background:var(--red)}
.tl .tt{font-size:12.5px;color:var(--muted)}
.tl .ev{font-weight:600}
.tl .dt{font-size:13px;color:#33414f;margin-top:2px}
.cm{padding:12px 16px;border-bottom:1px solid var(--border2)}
.cm:last-child{border-bottom:0}
.cm b{font-weight:600}.cm small{color:var(--muted)}
.cm p{margin:4px 0 0}

/* Documents */
.docsplit{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.doclist{list-style:none;margin:0;padding:0}
.doclist li{padding:12px 16px;border-bottom:1px solid var(--border2);cursor:pointer;display:flex;gap:12px;border-left:3px solid transparent}
.doclist li:last-child{border-bottom:0}
.doclist li:hover{background:#f6f9fc}
.doclist li.sel{background:#eef4fb;border-left-color:var(--accent)}
.doclist .dn{font-weight:600}.doclist .dm{font-size:12px;color:var(--muted)}
.paper{background:#fff;border:1px solid #cfd6df;box-shadow:0 1px 3px rgba(16,24,40,.1);padding:34px 44px 38px;max-width:900px;margin:0 auto}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:12px}
.paper .org{font-weight:700;letter-spacing:1px;color:var(--navy)}
.paper .dept{font-size:12.5px;color:var(--muted)}
.paper .phr{text-align:right;font-size:12px;color:var(--muted)}
.paper h2{font-size:21px;margin:18px 0 6px;color:#10243b}
.paper h4{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);border-bottom:1px solid var(--border);padding-bottom:4px}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px}
.paper table td,.paper table th{border:1px solid #d4dae2;padding:7px 10px;text-align:left;vertical-align:top}
.paper table th{background:#f3f5f8;font-weight:600;width:210px}
.paper table.grid th{width:auto}
.paper p{margin:6px 0}
.res{display:inline-block;font-weight:700;letter-spacing:1px;padding:2px 12px;border:2px solid;border-radius:3px;margin-left:8px}
.res.fail{color:var(--red);border-color:var(--red);background:#fdf1f0}
.res.pass{color:var(--green-d);border-color:var(--green);background:#eef8f2}
.resultline{font-size:15px;font-weight:600;margin:6px 0 14px}
.gauge{margin:12px 0 4px}
.gtrack{position:relative;height:16px;background:#e9edf2;border-radius:3px}
.gfill{height:100%;border-radius:3px 0 0 3px}
.gthr{position:absolute;top:-6px;bottom:-6px;width:2px;background:#33414f}
.gscale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.gleg{font-size:12.5px;color:#33414f;margin-top:6px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px;font-size:12.5px}
.sigs div{border-top:1px solid #8794a3;padding-top:6px}

/* Settings */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--border2)}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.linkbtn:hover{color:var(--red)}

/* Modal & toast */
.backdrop{position:fixed;inset:0;background:rgba(11,42,74,.48);display:grid;place-items:center;z-index:100;animation:fadein .15s ease}
.modal{background:#fff;border-radius:6px;width:500px;max-width:calc(100vw - 32px);box-shadow:0 16px 48px rgba(0,0,0,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center}
.modal h3{margin:0;font-size:17px;font-weight:600}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--border2);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc;border-radius:0 0 6px 6px}
.modal .q{font-size:15.5px;margin:0 0 12px}
.modal .ref{background:#f3f5f8;border:1px solid var(--border2);border-radius:4px;padding:8px 12px;font-size:13px;color:#33414f}
.modal .warn{margin-top:12px;font-size:12.5px;color:var(--amber)}
.modal label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
.modal label small{font-weight:400;color:var(--muted)}
.modal select,.modal textarea{width:100%}
.modal textarea{resize:vertical;min-height:72px}
#toasts{position:fixed;top:66px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:4px;box-shadow:0 6px 18px rgba(16,24,40,.16);padding:11px 16px;min-width:280px;font-size:13.5px;display:flex;gap:10px;align-items:center;animation:fadein .25s ease}
.toast.rej{border-left-color:var(--red)} .toast.info{border-left-color:var(--accent)} .toast.warn{border-left-color:#d08a00}
.toast.out{opacity:0;transition:opacity .4s}

@media (max-width:1280px){
  .split{grid-template-columns:minmax(0,1fr) 420px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1100px){
  .app{grid-template-columns:64px 1fr}
  .brand{width:64px;padding:0 17px}.brand div{display:none}
  .nav span.lbl,.navgroup,.sidefoot,.nav .badgec{display:none}
  .nav{justify-content:center;padding:12px 0}
  .split,.docsplit,.grid2{grid-template-columns:1fr}
  .tb-date,.profile div{display:none}
}
@media (max-width:760px){.search{display:none}.main{padding:14px}.pagehead{flex-direction:column}.btnrow{flex-direction:column}.paper{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">GC</div><div><b>Global Consumer Ltd.</b><small>Marketing Operations</small></div></div>
    <div class="search"><span id="ico-search"></span><input id="gsearch" type="text" placeholder="Search campaigns, IDs, products…" autocomplete="off" aria-label="Search campaigns"></div>
    <div class="tb-right">
      <div class="tb-date" id="tbDate"></div>
      <button class="tb-btn" data-act="fs" id="fsBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen"></button>
      <div class="bellwrap">
        <button class="tb-btn" data-act="bell" id="bellBtn" title="Notifications" aria-label="Notifications"></button>
        <div class="bellmenu" id="bellMenu"></div>
      </div>
      <button class="profile" data-act="profile" title="Account settings">
        <div class="avatar">MR</div>
        <div><b>Mohammad Ariful Hasan Rian</b><small>Marketing Intern · Marketing &amp; Brand Communications</small></div>
      </button>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

/* ---------- Static data ---------- */
var USER={name:'Mohammad Ariful Hasan Rian',dept:'Marketing & Brand Communications',role:'Marketing Intern'};
var REVIEW_DATE='17 Nov 2026';
var MAIN='MKT-2026-117';

/* ---------- Upload ---------- */
function handleFile(f){
 if(!f)return;
 if(!/^image\//.test(f.type)){toast('Please select an image file (PNG, JPG, WebP or SVG).','warn');return}
 var id=selId,r=new FileReader();
 r.onload=function(){
  var url=r.result,im=new Image();
  function done(w,h){
   imgCache[id]=url;S.imgMeta[id]={name:f.name,size:f.size,w:w,h:h};
   var ok=true;try{localStorage.setItem(IMGKEY+id,url)}catch(e){ok=false}
   save();zoom=100;render();
   toast(ok?'Creative image updated.':'Creative image updated for this session only (file too large to store).',ok?'info':'warn');
  }
  im.onload=function(){done(im.naturalWidth,im.naturalHeight)};
  im.onerror=function(){toast('That image could not be read.','warn')};
  im.src=url;
 };
 r.readAsDataURL(f);
}

function setFS(){
 var on=!!document.fullscreenElement;
 $('#fsBtn').innerHTML=icon(on?'fsx':'fs',18);
}
function toggleFS(){
 var el=document.documentElement;
 if(!document.fullscreenElement){(el.requestFullscreen?el.requestFullscreen():Promise.reject()).catch(function(){toast('Fullscreen is not available in this window.','warn')})}
 else document.exitFullscreen();
}
document.addEventListener('click',function(e){
 var bd=e.target;
 if(bd.classList&&bd.classList.contains('backdrop')){closeModal();return}
 if(!e.target.closest('.bellwrap'))$('#bellMenu').classList.remove('open');
 var t=e.target.closest('[data-act]');if(!t)return;
 var a=t.dataset.act,d=t.dataset;
 switch(a){
  case 'nav':go(d.view);break;
  case 'open':go('detail',{id:d.id});break;
  case 'opendoc':go('detail',{id:d.id,tab:'docs',doc:d.k});break;
  case 'tab':tab=d.tab;render();break;
  case 'doc':if(d.k==='asset'){tab='creative'}else docSel=d.k;render();break;
  case 'approve':approveModal();break;
  case 'reject':rejectModal();break;
  case 'close':closeModal();break;
  case 'confirm-approve':decide('approve');break;
  case 'confirm-reject':decide('reject');break;
  case 'zoomin':zoom=Math.min(200,zoom+25);render();break;
  case 'zoomout':zoom=Math.max(100,zoom-25);render();break;
  case 'zoomfit':zoom=100;render();break;
  case 'usedefault':delete imgCache[selId];delete S.imgMeta[selId];try{localStorage.removeItem(IMGKEY+selId)}catch(x){}save();render();toast('Submitted creative restored.','info');break;
  case 'bell':e.stopPropagation();$('#bellMenu').classList.toggle('open');break;
  case 'notif':
   var n=S.notifs.filter(function(x){return x.id===d.id})[0];
   if(n){n.read=true;save();if(n.cid)go('detail',{id:n.cid});else render()}
   $('#bellMenu').classList.remove('open');break;
  case 'markall':S.notifs.forEach(function(x){x.read=true});save();render();break;
  case 'clearq':query='';$('#gsearch').value='';refreshRows();break;
  case 'fs':toggleFS();break;
  case 'profile':go('settings');break;
  case 'reset-open':resetModal();break;
  case 'confirm-reset':resetDemo();break;
 }
});
document.addEventListener('input',function(e){
 if(e.target.id==='gsearch'){query=e.target.value;if(view!=='campaigns'){view='campaigns';render()}else refreshRows()}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.matches('[data-file]')){handleFile(t.files[0]);t.value=''}
 else if(t.matches('[data-filter]')){sf=t.value;refreshRows()}
 else if(t.matches('[data-pref]')){S.prefs[t.dataset.pref]=t.checked;save();document.body.classList.toggle('compact',!!S.prefs.compact)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modalRoot').firstChild)closeModal()});
document.addEventListener('dragover',function(e){var s=e.target.closest&&e.target.closest('#stage');if(s){e.preventDefault();s.classList.add('drag')}});
document.addEventListener('dragleave',function(e){var s=$('#stage');if(s)s.classList.remove('drag')});
document.addEventListener('drop',function(e){var s=e.target.closest&&e.target.closest('#stage');if(s){e.preventDefault();s.classList.remove('drag');handleFile(e.dataTransfer.files[0])}});
document.addEventListener('fullscreenchange',setFS);

/* ---------- Init ---------- */
$('#ico-search').innerHTML=icon('search',16);
$('#tbDate').textContent='Tuesday, 17 November 2026';
setFS();render();
})();
</script>
</body>
</html>
